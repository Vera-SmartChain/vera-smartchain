[package]
name = "vera-engine-v2"
version = "0.1.0"
edition = "2021"
description = "AI-Native Engine: Canonical SSA Graph + Isomorphic Normalizer + x86-64 JIT"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
lz4_flex = "0.11"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
blake3 = { version = "1.5", features = ["rayon"] }
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Memory"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bench]]
name = "hash_benchmark"
harness = false
path = "benches/hash_benchmark.rs"

[[bench]]
name = "ai_paradigm_benchmark"
harness = false
path = "benches/ai_paradigm_benchmark.rs"

