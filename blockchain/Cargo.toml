[package]
name = "vera-blockchain"
version = "0.1.0"
edition = "2021"
description = "Consensus Engine, State Transitions, and P2P Network for Vera Smart Chain"
license = "Apache-2.0"

[dependencies]
vera-engine-v2 = { path = "../vera-engine-v2" }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
ed25519-dalek = { version = "2.1", features = ["std", "rand_core"] }
rand = "0.8"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
revm = { version = "43.0.3", default-features = false, features = ["std"] }
blake3 = "1.8"

[[bin]]
name = "vera_node"
path = "src/bin/vera_node.rs"

[[bin]]
name = "vera_cli"
path = "src/bin/vera_cli.rs"

[dev-dependencies]
proptest = "=1.11.0"
